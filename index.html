<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Aplicación Web Serverless</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-right: 15px;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
        }
        .status.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status.loading {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .data-list {
            margin-top: 30px;
        }
        .data-item {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            border-left: 5px solid #667eea;
            transition: transform 0.2s;
        }
        .data-item:hover {
            transform: translateX(5px);
        }
        .timestamp {
            color: #666;
            font-size: 0.9em;
            margin-top: 10px;
        }
        .stats {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }
        .api-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-family: monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Mi Aplicación Web Serverless</h1>
        
        <div class="api-info">
            <strong>API Endpoint:</strong> <span id="apiUrl">Cargando...</span><br>
            <strong>Estado:</strong> <span id="apiStatus">Verificando...</span>
        </div>
        
        <form id="dataForm">
            <div class="form-group">
                <label for="name">👤 Nombre Completo:</label>
                <input type="text" id="name" name="name" required placeholder="Ingresa tu nombre completo">
            </div>
            
            <div class="form-group">
                <label for="email">📧 Correo Electrónico:</label>
                <input type="email" id="email" name="email" required placeholder="tu@email.com">
            </div>
            
            <div class="form-group">
                <label for="message">💬 Mensaje:</label>
                <textarea id="message" name="message" rows="4" required placeholder="Escribe tu mensaje aquí..."></textarea>
            </div>
            
            <button type="submit" id="submitBtn">📤 Enviar Datos</button>
            <button type="button" onclick="loadData()" id="loadBtn">🔄 Recargar Datos</button>
        </form>
        
        <div id="status"></div>
    </div>

    <div class="container">
        <div class="stats">
            <h2>📊 Estadísticas</h2>
            <p>Total de registros: <span id="totalCount">0</span></p>
            <p>Última actualización: <span id="lastUpdate">Nunca</span></p>
        </div>
        
        <div class="data-list">
            <h2>📋 Datos Almacenados en DynamoDB:</h2>
            <div id="dataContainer">
                <p>Cargando datos...</p>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ REEMPLAZA ESTA URL CON TU URL DE API GATEWAY
        const API_URL = 'https://7ptysucwaa.execute-api.us-east-1.amazonaws.com/prod/data';
        
        // Mostrar información de la API
        document.getElementById('apiUrl').textContent = API_URL;
        
        // Verificar estado de la API al cargar
        async function checkApiStatus() {
            try {
                const response = await fetch(API_URL);
                if (response.ok) {
                    document.getElementById('apiStatus').textContent = '✅ Conectado';
                    document.getElementById('apiStatus').style.color = 'green';
                } else {
                    throw new Error('API no responde correctamente');
                }
            } catch (error) {
                document.getElementById('apiStatus').textContent = '❌ Error de conexión';
                document.getElementById('apiStatus').style.color = 'red';
            }
        }
        
        document.getElementById('dataForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const statusDiv = document.getElementById('status');
            
            // Deshabilitar botón
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Enviando...';
            
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                message: document.getElementById('message').value,
                timestamp: new Date().toISOString(),
                userAgent: navigator.userAgent
            };
            
            try {
                statusDiv.innerHTML = '<div class="status loading">⏳ Enviando datos al servidor...</div>';
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    statusDiv.innerHTML = `
                        <div class="status success">
                            ✅ ¡Datos enviados correctamente!<br>
                            <small>ID: ${result.id}</small><br>
                            <small>Timestamp: ${result.timestamp}</small>
                        </div>
                    `;
                    document.getElementById('dataForm').reset();
                    loadData(); // Recargar datos automáticamente
                } else {
                    throw new Error(result.error || 'Error desconocido del servidor');
                }
                
            } catch (error) {
                console.error('Error:', error);
                statusDiv.innerHTML = `
                    <div class="status error">
                        ❌ Error: ${error.message}<br>
                        <small>Verifica que la URL de la API sea correcta</small>
                    </div>
                `;
            } finally {
                // Rehabilitar botón
                submitBtn.disabled = false;
                submitBtn.textContent = '📤 Enviar Datos';
            }
        });
        
        async function loadData() {
            const loadBtn = document.getElementById('loadBtn');
            const container = document.getElementById('dataContainer');
            
            loadBtn.disabled = true;
            loadBtn.textContent = '⏳ Cargando...';
            
            try {
                container.innerHTML = '<p>🔄 Cargando datos desde DynamoDB...</p>';
                
                const response = await fetch(API_URL);
                const result = await response.json();
                
                if (response.ok) {
                    const items = result.items || [];
                    document.getElementById('totalCount').textContent = items.length;
                    document.getElementById('lastUpdate').textContent = new Date().toLocaleString();
                    
                    if (items.length > 0) {
                        // Ordenar por timestamp (más reciente primero)
                        items.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                        
                        container.innerHTML = items.map((item, index) => `
                            <div class="data-item">
                                <strong>📝 Registro #${index + 1}</strong><br>
                                <strong>👤 Nombre:</strong> ${item.data.name}<br>
                                <strong>📧 Email:</strong> ${item.data.email}<br>
                                <strong>💬 Mensaje:</strong> ${item.data.message}<br>
                                <div class="timestamp">
                                    📅 Creado: ${new Date(item.timestamp).toLocaleString()}<br>
                                    🆔 ID: ${item.id}
                                </div>
                            </div>
                        `).join('');
                    } else {
                        container.innerHTML = `
                            <div class="data-item">
                                <p>📭 No hay datos almacenados aún.</p>
                                <p>¡Envía el primer mensaje usando el formulario de arriba!</p>
                            </div>
                        `;
                    }
                } else {
                    throw new Error(result.error || 'Error al cargar datos');
                }
                
            } catch (error) {
                console.error('Error loading data:', error);
                container.innerHTML = `
                    <div class="data-item">
                        <p style="color: red;">❌ Error cargando datos: ${error.message}</p>
                        <p>Verifica que la API esté funcionando correctamente.</p>
                    </div>
                `;
            } finally {
                loadBtn.disabled = false;
                loadBtn.textContent = '🔄 Recargar Datos';
            }
        }
        
        // Cargar datos al iniciar la página
        window.addEventListener('load', () => {
            checkApiStatus();
            loadData();
        });
        
        // Auto-refresh cada 30 segundos
        setInterval(loadData, 30000);
    </script>
</body>
</html>
